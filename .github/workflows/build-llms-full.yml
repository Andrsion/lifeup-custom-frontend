name: build-llms-full

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/build_llms.py'
      - '.github/workflows/build-llms-full.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rebuild llms-full.txt
        run: python3 scripts/build_llms.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- llms-full.txt; then
            echo "no change"
            exit 0
          fi
          git add llms-full.txt
          git commit -m "chore: 自动重建 llms-full.txt [skip ci]"
          git push
