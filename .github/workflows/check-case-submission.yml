name: check-case-submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  static-check:
    if: contains(github.event.issue.body, '### 案例名称') && contains(github.event.issue.body, '### 投稿确认')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan submission without executing it
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/check_case_submission.py

      - name: Post or update check report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- case-submission-auto-check -->';
            const report = fs.readFileSync('case-submission-report.md', 'utf8');
            const body = marker + '\n' + report;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
