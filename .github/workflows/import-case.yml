name: import-case

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue 编号"
        required: true
        type: string
      slug:
        description: "案例短名（小写英文、数字、连字符）"
        required: true
        type: string
      dry_run:
        description: "只预览不写入"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: import-case-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Import or preview case
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          python scripts/case_import.py 2>&1 | tee "$RUNNER_TEMP/import-output.txt"

      - name: Add report to step summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/import-output.txt" ]; then
            cat "$RUNNER_TEMP/import-output.txt" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f import-report.md ]; then
            cat import-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成导入报告；请查看上一步错误输出。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push imported case
        if: success() && inputs.dry_run == false
        env:
          SLUG: ${{ inputs.slug }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/cases/$SLUG.md" docs/cases/README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "没有可提交的案例变更。"
            exit 1
          fi
          git commit -m "feat(cases): 收录社区案例 $SLUG (issue #$ISSUE_NUMBER) [skip ci]"
          git push

      - name: Comment on the source Issue
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const report = fs.existsSync(process.env.RUNNER_TEMP + '/import-output.txt')
              ? fs.readFileSync(process.env.RUNNER_TEMP + '/import-output.txt', 'utf8').slice(-12000)
              : '未生成导入报告；请维护者查看 Actions 日志。';
            const title = process.env.DRY_RUN === 'true' ? '案例导入预览结果' : '案例导入结果';
            const body = '## ' + title + '\n\n~~~text\n' + report + '\n~~~' +
              '\n\n提醒：导入后仍需人工补齐「为什么好玩 / 灵感来源 / 机制决定情绪」，并复核授权与运行效果。';
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
